name: Daily AI Blog

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate a post without committing it"
        required: false
        default: false
        type: boolean
      date:
        description: "Optional publish date in YYYY-MM-DD format"
        required: false
        default: ""
        type: string
      backfill_from:
        description: "Optional first missing publish date to backfill in YYYY-MM-DD format"
        required: false
        default: ""
        type: string
      backfill_to:
        description: "Optional final publish date to backfill in YYYY-MM-DD format"
        required: false
        default: ""
        type: string
      backfill_limit:
        description: "Maximum missing dates to generate in one run"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-blog
  cancel-in-progress: false

jobs:
  generate:
    name: Generate daily resource post
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.BLOG_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      BLOG_MAX_OUTPUT_TOKENS: ${{ vars.BLOG_MAX_OUTPUT_TOKENS || '2400' }}
      BLOG_OPENAI_RETRIES: ${{ vars.BLOG_OPENAI_RETRIES || '2' }}
      BLOG_TOPIC_ATTEMPTS: ${{ vars.BLOG_TOPIC_ATTEMPTS || '4' }}
      BLOG_IMAGE_MODE: ${{ vars.BLOG_IMAGE_MODE || 'stock-required' }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      RUN_DATE: ${{ github.event.inputs.date }}
      BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
      BACKFILL_TO: ${{ github.event.inputs.backfill_to }}
      BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run blog:test

      - name: Generate blog post
        run: |
          DATE_ARGS=()
          if [ -n "$RUN_DATE" ]; then
            DATE_ARGS+=("--date=$RUN_DATE")
          fi

          BACKFILL_ARGS=()
          if [ -n "$BACKFILL_FROM" ]; then
            BACKFILL_ARGS+=("--from=$BACKFILL_FROM")
          fi
          if [ -n "$BACKFILL_TO" ]; then
            BACKFILL_ARGS+=("--to=$BACKFILL_TO")
          fi
          if [ -n "$BACKFILL_LIMIT" ]; then
            BACKFILL_ARGS+=("--limit=$BACKFILL_LIMIT")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$BACKFILL_FROM" ] || [ -n "$BACKFILL_TO" ]; then
              npm run blog:backfill -- --dry-run "${BACKFILL_ARGS[@]}"
            else
              npm run blog:generate -- --dry-run "${DATE_ARGS[@]}"
            fi
          elif [ -n "$RUN_DATE" ]; then
            npm run blog:generate -- "${DATE_ARGS[@]}"
          else
            npm run blog:backfill -- "${BACKFILL_ARGS[@]}"
          fi

      - run: npm run blog:validate

      - run: npm run lint

      - run: npm run build

      - name: Commit generated post
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- content/resources public/images/blog)" ]; then
            echo "No generated content changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/resources public/images/blog
          git commit -m "Add daily AI resource post"
          git push
